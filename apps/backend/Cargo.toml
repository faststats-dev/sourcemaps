[package]
name = "sourcemaps"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
aws-sdk-s3 = "1.146.1"
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sourcemap = "9.3.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zstd = "0.14.0"
